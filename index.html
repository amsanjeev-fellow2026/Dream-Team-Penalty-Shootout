<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dream Team Penalty Shootout</title>
<style>
:root{--gold:#ffd23f;--card:#0a2e18}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{position:fixed;inset:0;width:100%;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;background:repeating-linear-gradient(90deg,#0b6b2e 0 8vw,#0f8a3c 8vw 16vw);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:1.4vh;color:#fff;background:#14532d;padding:1.2vh 2vh;font-weight:700;font-size:2.2vh}
button:disabled{opacity:.35;cursor:not-allowed}
#app{height:100%;display:flex;flex-direction:column;gap:1vh;padding:1vh 1.5vw}
.setup{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8vh;background:#000a;border-radius:3vh;padding:2vh}
.title{font-size:5.5vh;font-weight:900;text-shadow:0 .4vh 0 #000;text-align:center}
.lbl{font-size:2.8vh;font-weight:800;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:1.2vh;justify-content:center}
input{font-size:2.8vh;padding:1.2vh 1.6vh;border-radius:1.2vh;border:.4vh solid var(--gold);width:24vh;text-align:center}
.opt.on{background:#0c9a41;outline:.5vh solid var(--gold)}
.big{background:var(--gold);color:#222;font-size:3.6vh;padding:1.6vh 5vh}
.err{color:#ff8a8a;font-weight:800;min-height:3vh;font-size:2.4vh}
.score{display:flex;gap:1vh;background:#000c;border:.5vh solid #fff3;border-radius:2vh;padding:1vh}
.tm{flex:1;min-width:0;text-align:center;border-radius:1.4vh;border:.5vh solid transparent;padding:.4vh}
.tm.act{border-color:var(--gold);background:#ffd23f22}
.tm b{display:block;font-size:2.6vh;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .n{font-size:6.5vh;font-weight:900;line-height:1;color:var(--gold)}
.tm small{display:block;min-height:2vh;font-size:1.6vh}
.pu{display:flex;gap:.6vh;justify-content:center;flex-wrap:wrap}
.pu button{font-size:1.6vh;padding:.4vh 1vh;background:#fff2}
.pu button.x{opacity:.3;text-decoration:line-through}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 1.5vh;font-weight:800;font-size:2.2vh;text-align:center}
.msg{text-align:center;font-size:3vh;font-weight:800;text-shadow:0 .3vh 0 #000}
.pitch{flex:1;min-height:0;position:relative}
.goal{position:absolute;left:50%;top:2%;translate:-50% 0;height:66%;aspect-ratio:2.3/1;max-width:96%;border:1vh solid #fff;border-bottom:0;border-radius:1vh 1vh 0 0;background:#0008;background-image:linear-gradient(#fff3 .2vh,transparent .2vh),linear-gradient(90deg,#fff3 .2vh,transparent .2vh);background-size:2.4vh 2.4vh}
.goal.net{animation:ripple .6s}
.grid{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:.6vh;padding:.6vh}
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;font-size:6vh;background:#ffffff1c;border:.3vh solid #fff7}
.sq small{font-size:2.2vh;color:var(--gold);margin-top:.6vh}
.sq:hover:not(:disabled){background:#ffd23f66}
.sq.used{background:#000b;border-style:dashed;font-size:3vh}
.sq.tgt{background:#ffd23f99}
.keeper{position:absolute;z-index:1;left:50%;bottom:0;translate:-50% 0;height:62%;aspect-ratio:.6;pointer-events:none}
.keeper svg{width:100%;height:100%;animation:sway 1.1s ease-in-out infinite alternate}
.ball{position:absolute;z-index:3;left:50%;bottom:4%;width:8vh;height:8vh;margin-left:-4vh;pointer-events:none}
.spot{position:absolute;left:50%;bottom:3%;width:11vh;height:2.4vh;margin-left:-5.5vh;border-radius:50%;background:#0006}
.foot{display:flex;gap:1vh;justify-content:center}
.foot button{background:#000a;font-size:1.9vh;padding:.9vh 1.6vh}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:2vh;z-index:10}
.ov.top{z-index:30;background:#000a}
.box{background:var(--card);border:.6vh solid var(--gold);border-radius:3vh;padding:2.4vh;width:min(96vw,1100px);max-height:96dvh;text-align:center;display:flex;flex-direction:column;gap:1.6vh}
.q{font-size:5vh;font-weight:800;line-height:1.25}
.ans{font-size:6vh;color:var(--gold);font-weight:900}
.tag{font-size:2.4vh}
.hint{font-size:3vh;color:#bfe9ff}
.ok{background:#16a34a;font-size:3.4vh}.no{background:#e63946;font-size:3.4vh}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh;text-align:left}
.rg div{background:#0006;border-radius:1.6vh;padding:1.4vh;font-size:1.9vh;line-height:1.35}
.rg h3{margin:0 0 .6vh;color:var(--gold);font-size:2.6vh}
.res{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;text-align:center;overflow:hidden;background:#000a}
.res h2{margin:0;font-size:14vh;text-shadow:0 .8vh 0 #000;animation:pop .6s}
.res p{margin:0;font-size:4.4vh;font-weight:800}
.res.goal-r h2{color:#4ade80}.res.save-r h2{color:#ff6b6b}.res.miss-r h2{color:#cbd5e1}
.cf{position:absolute;top:-6vh;width:1.6vh;height:2.6vh;animation:fall 3s linear forwards}
.cert{border:.8vh double var(--gold);border-radius:2vh;padding:2vh 5vh;font-size:3.4vh;font-weight:800}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@keyframes sway{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
@keyframes ripple{40%{filter:brightness(2.2);transform:scale(1.02)}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[r(0,a.length-1)],fmt=n=>n.toLocaleString('en-US');
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=m=>{let h=Math.floor(m/60)%24,mi=m%60,ap=h<12?'AM':'PM';h=h%12||12;return h+':'+String(mi).padStart(2,'0')+' '+ap};
const dur=d=>Math.floor(d/60)+' hr '+d%60+' min';
// ---------- questions ----------
const G={
numbers:{
E:[()=>{const n=r(10000,99999),p=r(0,4),s=String(n).split(''),dd=+s[4-p]||5;s[4-p]=dd;return{q:`What is the place value of ${dd} in ${fmt(+s.join(''))}?`,a:fmt(dd*10**p),h:`Which place is the ${dd} in? Ones, tens, hundreds...`}},
()=>{let a=r(10000,99999),b=r(10000,99999);if(a==b)b++;return{q:`Which number is greater?<br>${fmt(a)} or ${fmt(b)}`,a:fmt(Math.max(a,b)),h:'Compare the ten-thousands digit first.'}},
()=>{const d=shuf([1,2,3,4,5,6,7,8,9]).slice(0,4);return{q:`Make the smallest number using<br>${d.join(', ')} (use each once)`,a:fmt(+[...d].sort().join('')),h:'Smallest digit goes in the biggest place.'}}],
M:[()=>{const s=new Set();while(s.size<3)s.add(r(10000,99999));const a=[...s];return{q:`Arrange in ascending order:<br>${a.map(fmt).join(' , ')}`,a:[...a].sort((x,y)=>x-y).map(fmt).join(' &lt; '),h:'Ascending means smallest to greatest.'}},
()=>{const d=shuf([1,2,3,4,5,6,7,8,9]).slice(0,5);return{q:`Greatest 5-digit number using<br>${d.join(', ')} (use each once)`,a:fmt(+[...d].sort().reverse().join('')),h:'Biggest digit goes in the biggest place.'}},
()=>{const a=r(60000,99999),b=r(10000,a-10000);return{q:`Find the difference:<br>${fmt(a)} - ${fmt(b)}`,a:fmt(a-b),h:'Subtract column by column and regroup.'}},
()=>{const n=r(10000,99999),p=[];String(n).split('').forEach((c,i)=>{if(c!='0')p.push(fmt(+c*10**(4-i)))});return{q:`Write the expanded form of ${fmt(n)}`,a:p.join(' + '),h:'Split the number by place value.'}}],
H:[()=>{const a=r(20000,60000),b=r(10000,39999);return{q:`Find:<br>${fmt(a)} + ${fmt(b)}`,a:fmt(a+b),h:'Add from the ones place and carry.'}},
()=>{const a=r(50000,79999),b=r(30000,49999);return{q:`A stadium has ${fmt(a)} spectators. Another has ${fmt(b)}. How many more spectators are in the first?`,a:fmt(a-b),h:'"How many more" means subtract.'}},
()=>{const a=r(1200,4999),b=r(3,7);return{q:`Find:<br>${fmt(a)} x ${b}`,a:fmt(a*b),h:'Multiply each place, starting with ones.'}}]},
measure:{
E:[()=>{const k=r(2,9);return{q:`How many metres are in ${k} km?`,a:fmt(k*1000)+' m',h:'1 km = 1,000 m'}},
()=>{const m=r(2,9);return{q:`How many centimetres are in ${m} m?`,a:m*100+' cm',h:'1 m = 100 cm'}}],
M:[()=>{const a=r(2,6),b=r(1,9)*10,n=r(2,4),t=(a*100+b)*n;return{q:`Multiply:<br>${a} m ${b} cm x ${n}`,a:Math.floor(t/100)+' m '+t%100+' cm',h:'Change to cm first, multiply, then change back.'}}],
H:[()=>{const a=r(2,7),b=r(1,9)*50%1000||50,c=r(1,5),d=r(1,9)*50%1000||50,t=a*1000+b+c*1000+d;return{q:`Add:<br>${a} km ${b} m + ${c} km ${d} m`,a:Math.floor(t/1000)+' km '+t%1000+' m',h:'Add metres first. 1,000 m = 1 km.'}}]},
time:{
E:[()=>{const h=r(2,6);return{q:`How many minutes are in ${h} hours?`,a:h*60+' minutes',h:'1 hour = 60 minutes'}},
()=>{const m=r(2,9);return{q:`How many seconds are in ${m} minutes?`,a:m*60+' seconds',h:'1 minute = 60 seconds'}}],
M:[()=>{const s=r(6,9)*60+r(1,11)*5,d=r(1,3)*60+r(1,11)*5;return{q:`A train leaves at ${tm(s)}.<br>The journey takes ${dur(d)}.<br>When does it arrive?`,a:tm(s+d),h:'Add the hours, then the minutes.'}}],
H:[()=>{const s=r(9,15)*60+r(0,11)*5,d=r(18,48)*5;return{q:`A match starts at ${tm(s)} and ends at ${tm(s+d)}.<br>How long was it?`,a:dur(d),h:'Count up from the start time to the end time.'}}]}};
const bank=(mode,d)=>pick(G[mode=='mixed'?pick(['numbers','measure','time']):mode][d])();
// ---------- audio ----------
let ac,mg,fg,song=1,step=0,nextT=0,timer,fxOn=true;
function A(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.45;mg.connect(ac.destination);fg=ac.createGain();fg.gain.value=.9;fg.connect(ac.destination)}if(ac.state=='suspended')ac.resume();return ac}
function osc(t,f,d,ty,v,dest,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(dest);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,fr,dest,at){const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fr;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+(at||.01));g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(dest);s.start(t)}
function fx(n){if(!fxOn)return;try{A();const t=ac.currentTime;
if(n=='click')osc(t,700,.08,'square',.15,fg);
if(n=='kick'){osc(t,160,.15,'sine',.8,fg,50);noise(t,.1,.4,1500,fg)}
if(n=='net')noise(t,.5,.5,3000,fg,.02);
if(n=='goal'){noise(t,2.8,.7,900,fg,.5);[523,659,784,1047,784,1047].forEach((f,i)=>osc(t+i*.13,f,.3,'sawtooth',.18,fg))}
if(n=='save'){noise(t,1.4,.4,500,fg,.3);osc(t,380,.9,'sawtooth',.18,fg,140)}
if(n=='miss'){osc(t,500,.8,'sine',.25,fg,150);noise(t,1.2,.25,700,fg,.2)}
if(n=='card')[880,1175,1568].forEach((f,i)=>osc(t+i*.09,f,.2,'triangle',.2,fg));
if(n=='life'){osc(t,500,.15,'triangle',.25,fg);osc(t+.12,750,.2,'triangle',.25,fg)}
if(n=='whistle'){const o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain();o.frequency.value=2800;l.frequency.value=40;lg.gain.value=120;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(.3,t);g.gain.setValueAtTime(.3,t+.5);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g).connect(fg);o.start(t);l.start(t);o.stop(t+.65);l.stop(t+.65)}
}catch(e){}}
const SONGS=[{n:'Stadium Stomp',bpm:112,k:[0,2,8,10],c:[4,12],h:[0,2,4,6,8,10,12,14],b:[48,0,0,48,0,0,50,0,52,0,0,52,0,0,55,0],m:[0,0,0,0,72,0,0,0,0,0,0,0,76,0,74,0]},
{n:'Victory March',bpm:132,k:[0,4,8,12],c:[4,12],h:[2,6,10,14],b:[43,0,43,0,48,0,48,0,50,0,50,0,48,0,43,0],m:[67,0,71,0,74,0,71,0,72,0,76,0,79,0,76,0]},
{n:'Crowd Chant',bpm:104,k:[0,2,8,10],c:[4,12],h:[],b:[],m:[],w:1,v:[64,0,64,0,67,0,0,0,64,0,64,0,69,0,67,0]},
{n:'Champions Anthem',bpm:116,k:[0,4,8,12],c:[4,12],h:[2,6,10,14],b:[],m:[],w:1,v:[0,0,0,0,69,0,72,0,76,0,0,0,74,0,72,0],p:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]}];
function choir(t,f,d,v){const g=ac.createGain(),bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=750;bp.Q.value=2.5;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+d);[0,9,-9].forEach(c=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=c;o.connect(bp);o.start(t);o.stop(t+d+.05)});bp.connect(g).connect(mg)}
function brass(t,n,d,v){const g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(400,t);lp.frequency.linearRampToValueAtTime(2200,t+.15);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+d);n.forEach(m=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=mf(m);o.connect(lp);o.start(t);o.stop(t+d+.05)});lp.connect(g).connect(mg)}
const mf=m=>440*2**((m-69)/12);
function tick(){const s=SONGS[song-1];if(!ac||!s)return;const d=60/s.bpm/2;
while(nextT<ac.currentTime+.3){const t=nextT,i=step%16;
if(s.k.includes(i))osc(t,150,.18,'sine',.9,mg,45);
if(s.c.includes(i))noise(t,.12,.5,1800,mg);
if(s.h.includes(i))noise(t,.04,.12,7000,mg);
if(s.b[i])osc(t,mf(s.b[i]),d*1.6,'triangle',.35,mg);
if(s.m[i])osc(t,mf(s.m[i]),d*1.5,'square',.08,mg);
if(s.v&&s.v[i])choir(t,mf(s.v[i]),d*1.8,.14);
if(s.p&&(i==0||i==8))brass(t,s.p[Math.floor(step/16)%s.p.length],d*7,.07);
if(s.w&&i==0)noise(t,d*16,.16,600,mg,1);
nextT+=d;step++}}
function music(){clearInterval(timer);if(song&&ac){nextT=ac.currentTime+.05;step=0;timer=setInterval(tick,100)}}
function songBtn(){A();song=(song+1)%(SONGS.length+1);music();$('#bs').textContent='Music: '+(song?SONGS[song-1].n:'Off')}
function fxBtn(b){fxOn=!fxOn;b.textContent='Effects: '+(fxOn?'On':'Off')}
// ---------- data ----------
const MODES={numbers:'Numbers',measure:'Measurement',time:'Time',mixed:'Mixed Revision'};
const DIFF=['E','E','M','E','H','M','M','E','H'],PTS={E:1,M:2,H:3},DN={E:'Easy',M:'Medium',H:'Hard'};
const CARDS={var:['VAR Review','If your next answer is wrong, the SAME question is shown again for a second try.','VAR'],retake:['Penalty Retake','If your next answer is wrong, you get a NEW question of the same difficulty.','RETAKE'],free:['Free Kick','No question. The kick is an automatic goal worth 2 points.','FREE KICK'],super:['Super Shot','Your next goal is worth DOUBLE points.','SUPER']};
const LIFE={ask:['Ask Your Team','Your team may talk about the question together for 30 seconds before the player answers.'],coach:['Coach Advice','The teacher gives a hint that helps with the question. The answer is not shown.'],replay:['Replay','Throw away this question and get a brand new question of the same difficulty.']};
let S={n:2,names:[],mode:'numbers'},cur,busy=0;
// ---------- setup and rules ----------
function setup(){S.teams=null;closeM();const n=S.n;
app.innerHTML=`<div class="setup"><div class="title">DREAM TEAM PENALTY SHOOTOUT</div>
<div class="lbl">Number of teams</div><div class="row">${[2,3,4].map(k=>`<button class="opt ${n==k?'on':''}" onclick="S.n=${k};setup()">${k} teams</button>`).join('')}</div>
<div class="lbl">Enter team names</div><div class="row">${Array.from({length:n},(_,i)=>`<input maxlength="16" placeholder="Team ${i+1} name" value="${esc(S.names[i]||'')}" oninput="S.names[${i}]=this.value">`).join('')}</div>
<div class="lbl">Topic</div><div class="row">${Object.keys(MODES).map(k=>`<button class="opt ${S.mode==k?'on':''}" onclick="S.mode='${k}';setup()">${MODES[k]}</button>`).join('')}</div>
<div class="err" id="err"></div><button class="big" onclick="toRules()">Read the rules</button></div>`}
function toRules(){const n=S.names.slice(0,S.n).map(x=>(x||'').trim());if(n.length<S.n||n.some(x=>!x)){$('#err').textContent='Please enter a name for every team.';return}
S.names=n;A();rules()}
function rules(){const g=!!S.teams;
modal(`<div class="title" style="font-size:4vh">RULES</div><div class="rg">
<div><h3>How to play</h3>Teams take turns taking penalties. The team picks a spot in the goal. A question appears. Press Show answer, then mark Correct or Wrong. Correct is a GOAL. Wrong is SAVED or OFF TARGET. The team with the most points at the end wins the Golden Boot.</div>
<div><h3>Points</h3>Each square shows its points.<br>Easy square = 1 point<br>Medium square = 2 points<br>Hard square = 3 points<br>Squares 1, 2, 4, 8 are easy. 3, 6, 7 are medium. 5 and 9 are hard.</div>
<div><h3>Hidden cards (2 per kick)</h3>${Object.values(CARDS).map(c=>`<b>${c[0]}:</b> ${c[1]}<br>`).join('')}After a card, pick another square (except Free Kick).</div>
<div><h3>Lifelines (once per team)</h3>${Object.values(LIFE).map(c=>`<b>${c[0]}:</b> ${c[1]}<br>`).join('')}Click a lifeline to see what it does before using it.</div></div>
<button class="big" style="font-size:3vh;padding:1.2vh 4vh" onclick="${g?'closeM()':'begin()'}">${g?'Back to game':'Start match'}</button>`)}
function begin(){closeM();S.teams=S.names.map(x=>({name:x,score:0,used:{},second:null,sup:false}));S.cur=0;S.kick=0;S.total=S.n==2?10:12;A();music();fx('whistle');newBoard()}
function newBoard(){const ix=shuf([0,1,2,3,4,5,6,7,8]).slice(0,2),ty=shuf(Object.keys(CARDS));S.board=DIFF.map((d,i)=>({d,card:ix.includes(i)?ty[ix.indexOf(i)]:null,done:false}));busy=0;render()}
// ---------- main screen ----------
const KEEPER=`<svg viewBox="0 0 60 100"><line x1="25" y1="56" x2="22" y2="92" stroke="#111" stroke-width="8" stroke-linecap="round"/><line x1="35" y1="56" x2="38" y2="92" stroke="#111" stroke-width="8" stroke-linecap="round"/><rect x="19" y="22" width="22" height="36" rx="6" fill="#ff7a00"/><line x1="21" y1="27" x2="6" y2="8" stroke="#ff7a00" stroke-width="7" stroke-linecap="round"/><line x1="39" y1="27" x2="54" y2="8" stroke="#ff7a00" stroke-width="7" stroke-linecap="round"/><circle cx="6" cy="8" r="6" fill="#22d3ee"/><circle cx="54" cy="8" r="6" fill="#22d3ee"/><circle cx="30" cy="13" r="9" fill="#f1c27d"/></svg>`;
const BALL=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#fff" stroke="#222" stroke-width="1.5"/><polygon points="20,11 28,17 25,27 15,27 12,17" fill="#222"/><path d="M20 11V2M28 17l9-3M25 27l6 8M15 27l-6 8M12 17l-9-3" stroke="#222" stroke-width="1.5"/></svg>`;
function render(){const T=S.teams;
app.innerHTML=`<div class="score">${T.map((t,i)=>`<div class="tm ${i==S.cur?'act':''}"><b>${esc(t.name)}</b><div class="n">${t.score}</div><small>${t.sup?'Super Shot ready ':''}${t.second?(t.second=='var'?'VAR ready':'Retake ready'):''}</small><div class="pu">${Object.keys(LIFE).map(k=>`<button class="${t.used[k]?'x':''}" onclick="lifeInfo('${k}')">${LIFE[k][0]}</button>`).join('')}</div></div>`).join('')}<div class="mid">Penalty<br>${S.kick+1} / ${S.total}</div></div>
<div class="msg">${esc(T[S.cur].name)}: choose your penalty spot</div>
<div class="pitch" id="pitch"><div class="goal" id="goal"><div class="keeper" id="keeper">${KEEPER}</div><div class="grid">${S.board.map((b,i)=>`<button class="sq ${b.done?'used':''}" ${b.done?'disabled':''} onclick="shoot(${i})">${b.done?(b.card?CARDS[b.card][2]:'Taken'):i+1}<small>${b.done?'':PTS[b.d]+(PTS[b.d]>1?' pts':' pt')}</small></button>`).join('')}</div></div><div class="spot"></div><div class="ball" id="ball">${BALL}</div></div>
<div class="foot"><button id="bs" onclick="songBtn()">Music: ${song?SONGS[song-1].n:'Off'}</button><button onclick="fxBtn(this)">Effects: ${fxOn?'On':'Off'}</button><button onclick="rules()">Rules</button><button onclick="newGame()">New game</button></div>`}
function shoot(i){if(busy)return;fx('click');const b=S.board[i];b.done=true;
if(b.card){fx('card');const c=CARDS[b.card],t=S.teams[S.cur];if(b.card=='var'||b.card=='retake')t.second=b.card;if(b.card=='super')t.sup=true;const f=b.card=='free';
modal(`<div class="ans">${c[0]}</div><div class="q" style="font-size:3.6vh">${c[1]}</div><button class="big" onclick="closeM();${f?`resolve(${i},true,2)`:'render()'}">${f?'Take the kick':'Continue: pick another square'}</button>`);return}
ask(b.d,i)}
function ask(d,sq,second,q){cur={d,sq,q:q||bank(S.mode,d),shown:false,second};const t=S.teams[S.cur];
modal(`<div class="tag">${esc(t.name)} | ${DN[d]} | ${PTS[d]} pt${PTS[d]>1?'s':''}${t.sup?' x2 (Super Shot)':''}${second?' | SECOND CHANCE':''}</div><div class="q">${cur.q.q}</div><div id="ex"></div><div class="row" id="pw"></div><div class="row" id="rv"><button class="big" style="font-size:3vh;padding:1.2vh 3.5vh" onclick="reveal()">Show answer</button></div>`);pw()}
function pw(){const t=S.teams[S.cur],e=$('#pw');if(e)e.innerHTML=Object.keys(LIFE).map(k=>`<button ${t.used[k]||cur.shown?'disabled':''} onclick="lifeInfo('${k}',true)">${LIFE[k][0]}</button>`).join('')}
function lifeInfo(k,use){fx('life');const t=S.teams[S.cur],can=use&&!t.used[k]&&!cur.shown;
const o=document.createElement('div');o.className='ov top';o.id='li';o.innerHTML=`<div class="box"><div class="ans">${LIFE[k][0]}</div><div class="q" style="font-size:3.6vh">${LIFE[k][1]}</div>${use&&t.used[k]?'<div class="tag">Already used by this team.</div>':''}<div class="row">${can?`<button class="ok" onclick="useLife('${k}')">Use it now</button>`:''}<button class="no" style="background:#334155" onclick="$('#li').remove()">${can?'Cancel':'Close'}</button></div></div>`;document.body.appendChild(o)}
function useLife(k){$('#li').remove();const t=S.teams[S.cur],ex=$('#ex');t.used[k]=1;
if(k=='replay'){closeM();ask(cur.d,cur.sq,cur.second);return}
if(k=='coach')ex.innerHTML=`<div class="hint">Hint: ${cur.q.h}</div>`;
if(k=='ask'){let s=30;ex.innerHTML=`<div class="hint">Talk with your team: <b id="tt">30</b> s</div>`;const iv=setInterval(()=>{s--;const x=$('#tt');if(!x){clearInterval(iv);return}x.textContent=s;if(s<=0){clearInterval(iv);fx('whistle')}},1000)}
pw()}
function reveal(){cur.shown=true;$('#ex').innerHTML+=`<div class="ans">${cur.q.a}</div>`;$('#rv').innerHTML=`<button class="ok" onclick="mark(true)">Correct: GOAL</button><button class="no" onclick="mark(false)">Wrong</button>`;pw()}
function mark(ok){closeM();const t=S.teams[S.cur];
if(ok)resolve(cur.sq,true,PTS[cur.d]);
else if(t.second&&!cur.second){const k=t.second,c=cur;t.second=null;modal(`<div class="ans">${CARDS[k][0]}</div><div class="q" style="font-size:3.6vh">Second chance!</div><button class="big" onclick="closeM();ask('${c.d}',${c.sq},true,${k=='var'?'cur.q':'null'})">Go</button>`)}
else resolve(cur.sq,false)}
function resolve(sq,goal,p){const t=S.teams[S.cur],kind=goal?'goal':pick(['save','miss']);
if(goal){if(t.sup){p*=2;t.sup=false}t.score+=p}
busy=1;fx('kick');shot(sq,kind,()=>{fx(kind);result(kind,p)})}
// ---------- shot animation ----------
function shot(i,kind,cb){const sqs=document.querySelectorAll('.sq'),sr=sqs[i].getBoundingClientRect(),gr=$('#goal').getBoundingClientRect(),P=$('#pitch').getBoundingClientRect(),ball=$('#ball'),kp=$('#keeper'),
c=e=>{const q=e.getBoundingClientRect();return[q.left+q.width/2,q.top+q.height/2]},[bx,by]=c(ball),[kx,ky]=c(kp);let[tx,ty]=c(sqs[i]);sqs[i].classList.add('tgt');
const col=i%3,row=Math.floor(i/3);
if(kind=='miss'){tx+=(Math.random()<.5?-1:1)*gr.width*.12;ty=gr.top-P.height*.1}
const kc=kind=='save'?col:pick([0,1,2].filter(x=>x!=col)),[kxT,kyT]=c(sqs[row*3+kc]),dx=kxT-kx,dy=kyT-ky,rot=Math.abs(dx)>gr.width*.1?(dx>0?70:-70):0;
const E=`translate(${tx-bx}px,${ty-by}px) scale(.5) rotate(720deg)`;
ball.animate([{transform:'none'},{transform:`translate(${(tx-bx)*.6}px,${(ty-by)*.6-P.height*.1}px) scale(.8) rotate(360deg)`,offset:.6},{transform:E}],{duration:900,easing:'cubic-bezier(.3,.6,.5,1)',fill:'forwards'});
kp.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`}],{duration:550,delay:300,easing:'ease-out',fill:'forwards'});
setTimeout(()=>{if(kind=='goal'){fx('net');$('#goal').classList.add('net')}
if(kind=='save')ball.animate([{transform:E},{transform:`translate(${tx-bx+(Math.random()<.5?-1:1)*gr.width*.25}px,${ty-by+gr.height*.35}px) scale(.7) rotate(200deg)`}],{duration:500,easing:'ease-out',fill:'forwards'})},900);
setTimeout(cb,1700)}
// ---------- result and end ----------
function confetti(n){const C=['#ffd23f','#ff4d4d','#3b82f6','#ffffff','#22c55e'];return Array.from({length:n},()=>`<span class="cf" style="left:${r(0,98)}vw;background:${pick(C)};animation-delay:${Math.random()*1.6}s"></span>`).join('')}
function result(kind,p){const t=S.teams[S.cur],e=document.createElement('div');e.className='res '+kind+'-r';e.id='resEl';
e.innerHTML=(kind=='goal'?`<h2>GOAL!</h2><p>${esc(t.name)} scores ${p} point${p>1?'s':''}</p>`+confetti(40):kind=='save'?`<h2>SAVED!</h2><p>What a save by the keeper!</p>`:`<h2>OFF TARGET!</h2><p>Over the bar...</p>`)+`<button class="big" style="margin-top:2vh" onclick="nextKick()">Next penalty</button>`;document.body.appendChild(e)}
function nextKick(){const e=$('#resEl');if(e)e.remove();S.kick++;S.cur=(S.cur+1)%S.teams.length;if(S.kick>=S.total)return final();newBoard()}
function final(){const T=[...S.teams].sort((a,b)=>b.score-a.score),tie=T[0].score==T[1].score;
app.innerHTML=`<div class="setup"><div class="title">FULL TIME</div><div class="row">${T.map((t,i)=>`<div class="cert" style="font-size:3vh">${i+1}. ${esc(t.name)}: ${t.score}</div>`).join('')}</div>
${tie?`<div class="q">It is a draw! Play a sudden-death round?</div>`:`<div class="cert">GOLDEN BOOT AWARD<br>TEAM OF THE DAY<br><span style="color:var(--gold)">${esc(T[0].name)}</span></div>`}
<div class="row">${tie?`<button class="big" onclick="S.total=S.kick+S.teams.length;newBoard()">Sudden death</button>`:''}<button class="big" onclick="setup()">Play again</button></div></div>`;
if(!tie){fx('goal');const d=document.createElement('div');d.className='res';d.style.cssText='pointer-events:none;background:none';d.innerHTML=confetti(60);document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}}
function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='mod';o.innerHTML=`<div class="box">${h}</div>`;document.body.appendChild(o)}
function newGame(){if(busy)return;fx('click');modal(`<div class="ans">Start a new game?</div><div class="q" style="font-size:3.6vh">The current scores will be lost.</div><div class="row"><button class="ok" onclick="setup()">Yes, new game</button><button class="no" style="background:#334155" onclick="closeM()">Cancel</button></div>`)}
function closeM(){const o=$('#mod');if(o)o.remove()}
setup();
</script></body></html>
